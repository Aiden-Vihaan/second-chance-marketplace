version: "3.9"

services:
mongodb:
image: mongo:7
container_name: second-chance-mongodb
restart: unless-stopped
ports:
- "27017:27017"
volumes:
- mongodb_data:/data/db

backend:
build:
context: ./backend
container_name: second-chance-backend
restart: unless-stopped
ports:
- "5000:5000"
env_file:
- ./backend/.env.example
depends_on:
- mongodb

frontend:
build:
context: ./frontend
container_name: second-chance-frontend
restart: unless-stopped
ports:
- "5173:5173"
depends_on:
- backend

sentiment-service:
build:
context: ./sentiment-service
container_name: second-chance-sentiment
restart: unless-stopped
ports:
- "5001:5001"
depends_on:
- backend

volumes:
mongodb_data:
